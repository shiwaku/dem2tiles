<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>dem2tiles viewer</title>
  <meta name="description" content="dem2tiles が出力する Terrarium / Mapbox Terrain-RGB / 数値PNG の3種類の標高タイルを切り替え、段彩・陰影起伏・等高線・3D地形で確認するビューワ" />
  <meta name="theme-color" content="#2a78d6" />
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⛰</span>
        <h1>dem2tiles viewer</h1>
      </div>
      <div class="head-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <!-- ---- 地域 ---- -->
      <div class="field">
        <div class="field-head">
          <span class="field-label">地域</span>
        </div>
        <div id="region-modes" class="seg" role="group" aria-label="地域を選ぶ"></div>
        <p id="region-note" class="note"></p>
      </div>

      <!-- ---- 標高タイル（dem2tiles の3種類） ---- -->
      <div class="field">
        <div class="field-head">
          <span class="field-label">標高タイル</span>
          <span id="dem-badge" class="count-badge">–</span>
        </div>
        <div id="dem-modes" class="seg seg-v" role="group" aria-label="標高タイルを選ぶ"></div>
        <p id="dem-note" class="note"></p>
        <div class="readout">
          <div>ズーム <b id="zoom-val">–</b></div>
          <div id="tile-url" class="tile-url"></div>
        </div>
      </div>

      <!-- ---- 地形 ---- -->
      <div class="field">
        <div class="field-head">
          <span class="field-label">地形</span>
        </div>

        <label class="toggle">
          <input id="relief-on" type="checkbox" checked />
          <span class="switch"></span>
          <span class="t-label">段彩（標高）</span>
        </label>
        <div id="relief-opts">
          <div class="slider-row">
            <label for="relief-range">標高レンジ</label>
            <select id="relief-range" class="select select-inline" aria-label="段彩の標高レンジ"></select>
          </div>
          <div class="slider-row">
            <label for="relief-opacity">不透明度</label>
            <input id="relief-opacity" type="range" min="0.1" max="1" step="0.05" value="0.55" />
            <span id="relief-opacity-val" class="op-val">55%</span>
          </div>
          <div id="relief-legend" class="relief-legend" aria-label="標高の凡例"></div>
          <p class="note">段彩は数値PNGタイルから作り、無データ（NA）は透明にする。レンジを狭めると色が引き伸ばされ、細かな起伏が読める。</p>
        </div>

        <label class="toggle">
          <input id="hillshade-on" type="checkbox" checked />
          <span class="switch"></span>
          <span class="t-label">陰影起伏</span>
        </label>
        <div id="hillshade-opts">
          <select id="hillshade-method" class="select" aria-label="陰影起伏の算出方法"></select>
          <p id="hillshade-desc" class="note" aria-live="polite"></p>
          <div class="slider-row">
            <label for="hillshade-exag">強調</label>
            <input id="hillshade-exag" type="range" min="0" max="1" step="0.05" value="0.5" />
            <span id="hillshade-exag-val" class="op-val">0.50</span>
          </div>
        </div>

        <label class="toggle">
          <input id="terrain-on" type="checkbox" />
          <span class="switch"></span>
          <span class="t-label">3D地形</span>
        </label>
        <div id="terrain-opts" hidden>
          <div class="slider-row">
            <label for="terrain-exag">起伏倍率</label>
            <input id="terrain-exag" type="range" min="0" max="2" step="0.05" value="1" />
            <span id="terrain-exag-val" class="op-val">1.00</span>
          </div>
        </div>

        <label class="toggle">
          <input id="contours-on" type="checkbox" />
          <span class="switch"></span>
          <span class="t-label">等高線</span>
        </label>

        <p class="note">陰影起伏・3D地形は選んだ標高タイルを読む。等高線は Terrarium タイルから実行時に生成する。</p>
      </div>
    </div>

    <footer class="panel-foot">
      標高タイル: <a href="https://github.com/shiwaku/dem2tiles" target="_blank" rel="noopener">dem2tiles</a>
      （元データは各県の航空レーザ測量成果）<br />
      背景: <a href="https://github.com/gsi-cyberjapan/optimal_bvmap" target="_blank" rel="noopener">国土地理院 最適化ベクトルタイル</a> / <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a><br />
      ビューワの元: <a href="https://github.com/shiwaku/naisui-risk-verification" target="_blank" rel="noopener">naisui-risk-verification</a>
    </footer>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
